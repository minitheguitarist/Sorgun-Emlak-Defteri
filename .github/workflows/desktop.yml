name: Desktop Builds

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Masaüstü dosyalarının ekleneceği mevcut release tag'i"
        required: true
        default: "v1.0.7"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  linux-rpm:
    needs: quality
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            bash clang cmake curl file findutils gcc-c++ git gtk3-devel \
            jq libstdc++-devel ninja-build pkgconf-pkg-config rpm-build \
            tar unzip which xz zip

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Trust container-mounted Flutter SDK
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Build Linux release
        run: |
          flutter pub get
          flutter build linux --release

      - name: Build Fedora 44 RPM
        run: |
          chmod +x scripts/build-rpm.sh packaging/linux/sorgun-emlak-defteri
          scripts/build-rpm.sh
          mkdir -p release
          cp build/rpmbuild/RPMS/x86_64/*.rpm release/
          rpm -qip release/*.rpm
          rpm -qlp release/*.rpm

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-rpm
          path: release/*.rpm

  windows-installer:
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $source = Join-Path $env:WINDIR "System32/$dll"
            if (Test-Path $source) {
              Copy-Item $source $release -Force
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging/windows/sorgun-emlak-defteri.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-installer
          path: build/windows-installer/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux-rpm, windows-installer]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release
          for file in *.rpm *.exe; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Wait for or create GitHub Release
        run: |
          for attempt in $(seq 1 20); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sorgun Emlak Defteri $RELEASE_TAG" \
            --notes "Sorgun Emlak Defteri yayın dosyaları."

      - name: Upload desktop release assets
        run: |
          gh release upload "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Record desktop source commit
        run: |
          body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          marker="Masaüstü paketlerinin kaynak commit'i: ${GITHUB_SHA}"
          if ! printf '%s' "$body" | grep -Fq "$marker"; then
            printf '%s\n\n%s\n' "$body" "$marker" > release-notes.md
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          fi
